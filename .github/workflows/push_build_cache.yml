name: Cache DeepEP Build Artifacts (Ascend NPU)

on:
  push:
    branches: [ main ]
    paths:
      - "build.sh"
      - "csrc/**"
      - "python/**"
      - "scripts/prepare_opp_scaffold.sh"
      - "scripts/templates/**"
      - "scripts/prepare_deepep_in_container.sh"
      - "scripts/npu_ci_install_dependency.sh"
  workflow_dispatch:

concurrency:
  group: build-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-cache:
    name: Build Cache - ${{ matrix.arch }} - CANN ${{ matrix.cann_version }}
    runs-on: ${{ matrix.runner }}

    # Cache the wheels consumed by pr-test-deepep-npu.yml. The cache key must
    # stay in sync with that workflow (arch + CANN + Python version + source hash).
    strategy:
      matrix:
        include:
          # --- A3 environment (910C) ---
          - arch: a3
            runner: linux-aarch64-a3-800t-16
            cann_version: "9.0.0"
            image_tag: "9.0.0-a3-ubuntu22.04-py3.11"
          - arch: a3
            runner: linux-aarch64-a3-800t-16
            cann_version: "9.1.0"
            image_tag: "9.1.0-a3-ubuntu22.04-py3.12"

          # --- A2 environment (910B) ---
          - arch: a2
            runner: linux-aarch64-a2-8
            cann_version: "9.0.0"
            image_tag: "9.0.0-910b-ubuntu22.04-py3.11"
          - arch: a2
            runner: linux-aarch64-a2-8
            cann_version: "9.1.0"
            image_tag: "9.1.0-910b-ubuntu22.04-py3.12"

    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:${{ matrix.image_tag }}
    env:
      TORCH_CACHE_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/whl/cpu"
      PYPI_CACHE_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
      GITHUB_PROXY_URL: "https://gh-proxy.test.osinfra.cn/"
      UV_INDEX_URL: http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple

    steps:
      - name: Clean git config
        run: |
          CONFIG_KEY='http.https://gh-proxy.test.osinfra.cn/.extraheader'
          git config --global --unset "$CONFIG_KEY" || true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get build hash
        id: get_build_hash
        run: |
          BUILD_HASH=$(find ./csrc ./python ./build.sh \
            ./scripts/prepare_opp_scaffold.sh ./scripts/templates \
            ./scripts/prepare_deepep_in_container.sh ./scripts/npu_ci_install_dependency.sh \
            -type f -not -path '*/.*' 2>/dev/null | sort | xargs sha256sum | sha256sum | awk '{print $1}')
          echo "BUILD_HASH=$BUILD_HASH" >> $GITHUB_OUTPUT
          echo "Resolved build hash: $BUILD_HASH"

      - name: Restore build cache
        id: cache-build
        uses: runs-on/cache@v4
        with:
          path: output
          key: deep-ep-build-v2-${{ runner.os }}-${{ matrix.arch }}-cann${{ matrix.cann_version }}-py${{ matrix.cann_version == '9.1.0' && '3.12' || '3.11' }}-${{ steps.get_build_hash.outputs.BUILD_HASH }}

      - name: Install dependencies
        if: steps.cache-build.outputs.cache-hit != 'true'
        run: |
          CACHING_URL="cache-service.nginx-pypi-cache.svc.cluster.local"
          sed -Ei "s@(ports|archive).ubuntu.com@${CACHING_URL}:8081@g" /etc/apt/sources.list
          pip config set global.index-url http://${CACHING_URL}/pypi/simple
          pip config set global.trusted-host ${CACHING_URL}
          pip install uv
          bash scripts/npu_ci_install_dependency.sh --cann-version ${{ matrix.cann_version }}

      - name: Build artifacts
        if: steps.cache-build.outputs.cache-hit != 'true'
        run: |
          echo "🚀 Building ${matrix.arch} artifacts, CANN ${{ matrix.cann_version }}"
          if [ "${{ matrix.arch }}" = "a2" ]; then
            env -i PATH=${PATH} bash --login -c "
              export LD_LIBRARY_PATH=${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH} && \
              bash build.sh -a deepep2
            "
          else
            env -i PATH=${PATH} bash --login -c "
              export LD_LIBRARY_PATH=${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH} && \
              bash build.sh -a deepep
            "
          fi
