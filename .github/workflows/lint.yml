name: Lint

on: [ pull_request ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install pre-commit hook
        run: |
          python -m pip install uv
          uv pip install --system pre-commit
          pre-commit install

      - name: Linting
        run: pre-commit run --all-files --show-diff-on-failure

      # The migrated Python entry points are pure-Python modules; import-time
      # checks need neither NPU nor torch_npu. This catches syntax/import-path
      # regressions in the standalone layout before the NPU test jobs run.
      - name: Python syntax check
        run: |
          python -m compileall -q python/deep_ep tests
